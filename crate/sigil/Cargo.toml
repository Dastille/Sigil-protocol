[package]
name = "sigil"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Ashlynn"]
description = "Sigil protocol CLI — regenerative .sg1 seals (chaos fold, Reed–Solomon, Merkle)."
default-run = "sigil"

[features]
lab = ["dep:eframe", "dep:rfd"]
# Opt-in Cauchy MDS (bake-off). Off by default — Vandermonde stays production.
mds-cauchy = []

[[bin]]
name = "sigil-lab"
path = "src/bin/sigil-lab.rs"
required-features = ["lab"]

[dependencies]
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
raptorq = "=2.0.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
fuser = "0.18"
