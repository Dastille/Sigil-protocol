[package]
name = "sigil"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Ashlynn"]
description = "Sigil protocol CLI — regenerative .sg1 seals (chaos fold, Reed–Solomon, Merkle)."
default-run = "sigil"

[features]
lab = ["dep:eframe", "dep:rfd"]
# Opt-in Cauchy MDS (bake-off). Off by default — Vandermonde stays production.
mds-cauchy = []
# Real FIDO2 security keys (CTAP2 HID) for passkey-protected identities.
# Off by default; Linux needs libudev headers + pkg-config to build. See docs/PASSKEY.md.
passkey = ["dep:ctap-hid-fido2"]

[[bin]]
name = "sigil-lab"
path = "src/bin/sigil-lab.rs"
required-features = ["lab"]

[dependencies]
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
raptorq = "=2.0.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
zeroize = "1"
ctap-hid-fido2 = { version = "3.6", optional = true }
rpassword = "7"
aes = "0.8"
cfb-mode = "0.8"
# Lab GUI only. No default features: glow (OpenGL) instead of wgpu, and no `accesskit`
# (its Linux AT-SPI backend pulls zbus/zvariant, unmaintained per RUSTSEC-2026-0370/0371/0372)
# and no winit/default (its Adwaita title bar pulls ttf-parser, RUSTSEC-2026-0192).
eframe = { version = "0.37", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
ocb3 = "0.1"
eax = "0.5"

[target.'cfg(unix)'.dependencies]
fuser = "0.18"
