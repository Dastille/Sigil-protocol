# cargo-audit configuration (read by `cargo audit` run from crate/sigil, as CI does).
#
# Only "unmaintained" notices are listed here. No vulnerability advisory is
# ignored. Each entry is reviewed again whenever eframe is upgraded.

[advisories]
ignore = [
    # paste 1.0.15: no longer maintained.
    # Justification: paste is never compiled into any Sigil build. It is in
    # Cargo.lock only because eframe 0.32 has an optional wgpu renderer
    # (wgpu-hal -> metal -> paste) that Sigil does not enable;
    # `cargo tree -i paste --features lab --target all` finds no path. eframe 0.37
    # drops it, but that upgrade needs GUI API changes to sigil-lab that CI
    # does not build or test, so it is left for a separate, tested change.
    # It is a proc-macro helper with no runtime code and no known vulnerability.
    "RUSTSEC-2024-0436",

    # ttf-parser 0.25.1: unmaintained.
    # Justification: built only with the optional `lab` feature (the sigil-lab
    # GUI), via eframe 0.32 -> egui/epaint -> ab_glyph -> owned_ttf_parser.
    # The `sigil` CLI and library (default and passkey features) do not depend
    # on it. It parses fonts egui bundles and system fonts, never .sg1 input.
    # Upgrading eframe (0.37 tested) does not remove it: ab_glyph still pulls
    # it in. No maintained drop-in replacement is available through egui, and
    # there is no known vulnerability.
    "RUSTSEC-2026-0192",
]
