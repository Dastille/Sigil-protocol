name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    # Pinned images, not ubuntu-latest (which moves to 26.04 from 2026-10-19):
    # 24.04 is today's baseline, 26.04 proves the next one before the switch.
    name: build + test (default features, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crate/sigil
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate/sigil -> target
          key: ${{ matrix.os }}
      - name: build
        run: cargo build --locked --all-targets
      - name: test (lib + integration)
        run: cargo test --locked

  passkey:
    name: build + clippy + test (--features passkey, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crate/sigil
    steps:
      - uses: actions/checkout@v7
      - name: libudev headers + pkg-config for hidapi
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate/sigil -> target
          key: passkey
      # No security key on the runner: this proves the real CTAP backend compiles;
      # passkey logic itself is exercised through the software test authenticator.
      - name: build
        run: cargo build --locked --features passkey --all-targets
      # The lint job builds default features only, so the real CTAP backend
      # (src/passkey.rs behind cfg(feature = "passkey")) is linted here.
      - name: cargo clippy --features passkey -D warnings
        run: cargo clippy --locked --features passkey --all-targets -- -D warnings
      # Whole suite with the feature on: proves enabling passkey breaks nothing else.
      - name: test (all, --features passkey)
        run: cargo test --locked --features passkey

  lint:
    name: fmt + clippy (-D warnings)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crate/sigil
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate/sigil -> target
          key: lint
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crate/sigil
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any vulnerability advisory in Cargo.lock (all features, incl. the lab GUI).
      # Unmaintained-crate notices (paste, ttf-parser via eframe) are reported, not fatal.
      - name: cargo audit
        run: cargo audit
