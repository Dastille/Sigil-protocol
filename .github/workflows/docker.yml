# NOTE: Manual-only workflow (workflow_dispatch): never runs on push, pull_request,
# tags, or schedule (free plan billing). Does not push unless push=true is set.
name: docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.0.0 or main)"
        required: true
        default: "local"
        type: string
      push:
        description: "Push multi-arch image to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crate/sigil/Cargo.toml | head -n1)
          echo "version=${version:-1.0.0}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/sigil:${{ inputs.tag }}
          build-args: |
            SIGIL_VERSION=${{ steps.meta.outputs.version }}
            SIGIL_GIT_COMMIT=${{ steps.meta.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
