name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: sigil-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sigil-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sigil-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crate/sigil
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: pack unix
        if: matrix.os != 'windows-latest'
        run: |
          BIN=target/${{ matrix.target }}/release/sigil
          cp "$BIN" ${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
      - name: pack windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/sigil.exe ${{ matrix.artifact }}
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            crate/sigil/${{ matrix.artifact }}.tar.gz
            crate/sigil/${{ matrix.artifact }}.zip
            crate/sigil/${{ matrix.artifact }}
